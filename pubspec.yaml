name: guida

description: "A UNILAG navigation mobile app"

publish_to: "none" 

version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  geolocator: ^14.0.2
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.0
  ionicons: ^0.2.2
  loading_indicator: ^3.1.1
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cherry_toast: ^1.8.0
  flutter_polyline_points: ^3.1.0
  geocoding: ^4.0.0
  uuid: ^4.3.3
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  firebase_crashlytics: ^5.0.2
  cloud_firestore: ^6.0.2
  flutter_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/guida_logo.png
    - assets/map_error.png
    - assets/pin.png
    - assets/user.png
    - assets/walk.png
    - assets/walking.png
    - assets/car.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf

